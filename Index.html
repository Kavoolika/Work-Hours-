<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ساعت کاری</title>
<style>
:root{
  --bg:#E9EEF3; --paper:#FFFFFF; --ink:#12203A; --mute:#6B7A90; --line:#D5DDE6;
  --plus:#0E8F7E; --plus-bg:#D6F0EA; --minus:#D1433B; --minus-bg:#F8DEDB;
  --leave:#6B52C4; --leave-bg:#E5DFF7; --hol:#9AA6B6; --hol-bg:#EEF1F5; --today:#12203A;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:"Vazirmatn","Vazir",Tahoma,system-ui,sans-serif;font-size:15px;line-height:1.5}
.num{direction:ltr;unicode-bidi:isolate;display:inline-block}
.app{max-width:520px;margin:0 auto;padding:14px 12px 40px}

/* top bar */
.bar{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.bar h1{font-size:15px;margin:0;font-weight:600;color:var(--mute)}
.iconbtn{border:0;background:var(--paper);width:40px;height:40px;border-radius:12px;font-size:18px;color:var(--ink);cursor:pointer;box-shadow:0 1px 0 var(--line)}
.iconbtn:active{transform:scale(.95)}

/* balance — the main thing */
.balance{background:var(--ink);color:#fff;border-radius:22px;padding:18px 18px 16px;margin-bottom:12px}
.balance .lbl{font-size:13px;opacity:.7}
.balance .big{font-size:56px;font-weight:700;letter-spacing:-1px;line-height:1.1;margin:2px 0 2px}
.balance .big.pos{color:#5FE3CE}
.balance .big.neg{color:#FF9A92}
.balance .sub{font-size:13px;opacity:.75}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}
.stat{background:rgba(255,255,255,.09);border-radius:14px;padding:9px 10px}
.stat b{display:block;font-size:17px;font-weight:600}
.stat span{font-size:12px;opacity:.7}

/* month nav */
.nav{display:flex;align-items:center;justify-content:space-between;margin:6px 2px 8px}
.nav .title{text-align:center}
.nav .title b{font-size:18px;display:block;line-height:1.2}
.nav .title small{color:var(--mute);font-size:12px}
.nav button{border:0;background:var(--paper);width:42px;height:42px;border-radius:12px;font-size:18px;cursor:pointer;color:var(--ink)}

/* calendar */
.cal{background:var(--paper);border-radius:18px;padding:10px 8px 8px}
.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.dow{text-align:center;font-size:12px;color:var(--mute);padding:2px 0 4px}
.cell{aspect-ratio:1/1.12;border-radius:11px;border:0;background:#F5F7FA;padding:3px 2px;font-family:inherit;color:var(--ink);display:flex;flex-direction:column;align-items:center;justify-content:space-between;cursor:pointer;position:relative}
.cell.empty{background:transparent;cursor:default}
.cell .d{font-size:14px;font-weight:600;line-height:1.1;margin-top:3px}
.cell .v{font-size:10.5px;line-height:1;margin-bottom:5px;font-weight:600;direction:ltr}
.cell.off{background:var(--hol-bg);color:var(--hol)}
.cell.hol{background:var(--hol-bg);color:var(--minus)}
.cell.hol .d::after{content:"•";font-size:9px;margin-inline-start:2px}
.cell.pos{background:var(--plus-bg)} .cell.pos .v{color:var(--plus)}
.cell.neg{background:var(--minus-bg)} .cell.neg .v{color:var(--minus)}
.cell.zero{background:#E4EAF0} .cell.zero .v{color:var(--mute)}
.cell.leave{background:var(--leave-bg)} .cell.leave .v{color:var(--leave)}
.cell.today{outline:2px solid var(--today);outline-offset:-2px}
.legend{display:flex;flex-wrap:wrap;gap:10px;margin:10px 4px 2px;font-size:12px;color:var(--mute)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-inline-end:4px;vertical-align:-1px}

/* holidays list */
.card{background:var(--paper);border-radius:18px;padding:12px 14px;margin-top:12px}
.card h3{margin:0 0 6px;font-size:14px}
.hrow{display:flex;justify-content:space-between;font-size:13px;padding:5px 0;border-top:1px solid var(--line)}
.hrow:first-of-type{border-top:0}
.hrow span:last-child{color:var(--mute)}

/* sheet */
.scrim{position:fixed;inset:0;background:rgba(18,32,58,.45);display:none;z-index:10}
.scrim.open{display:block}
.sheet{position:fixed;left:0;right:0;bottom:0;max-width:520px;margin:0 auto;background:var(--paper);border-radius:24px 24px 0 0;padding:16px 16px calc(18px + env(safe-area-inset-bottom));z-index:11;transform:translateY(105%);transition:transform .22s ease;max-height:92vh;overflow:auto}
.sheet.open{transform:none}
.sheet h2{margin:0 0 2px;font-size:18px}
.sheet .hint{color:var(--mute);font-size:13px;margin-bottom:12px}
.seg{display:flex;background:#EEF2F6;border-radius:12px;padding:3px;margin-bottom:12px}
.seg button{flex:1;border:0;background:transparent;padding:9px;border-radius:10px;font-family:inherit;font-size:14px;color:var(--mute);cursor:pointer}
.seg button.on{background:#fff;color:var(--ink);font-weight:600;box-shadow:0 1px 3px rgba(0,0,0,.12)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
label.f{display:block;font-size:12px;color:var(--mute);margin-bottom:4px}
input[type=time],input[type=number],input[type=text],textarea{width:100%;border:1.5px solid var(--line);border-radius:12px;padding:10px 12px;font-family:inherit;font-size:17px;color:var(--ink);background:#fff;direction:ltr;text-align:center}
input[type=text],textarea{direction:rtl;text-align:right;font-size:15px}
textarea{min-height:90px;font-size:12px;direction:ltr;text-align:left}
input:focus,textarea:focus{outline:none;border-color:var(--ink)}
.toggle{display:flex;align-items:center;justify-content:space-between;background:#F5F7FA;border-radius:12px;padding:11px 14px;margin-bottom:12px;cursor:pointer;user-select:none}
.toggle small{color:var(--mute);display:block;font-size:12px}
.sw{width:46px;height:27px;border-radius:20px;background:#C4CDD8;position:relative;transition:.15s;flex:none}
.sw::after{content:"";position:absolute;top:3px;inset-inline-start:3px;width:21px;height:21px;border-radius:50%;background:#fff;transition:.15s}
.toggle.on .sw{background:var(--plus)}
.toggle.on .sw::after{inset-inline-start:22px}
.preview{border-radius:14px;padding:12px 14px;margin-bottom:12px;display:flex;justify-content:space-between;align-items:center;background:#EEF2F6}
.preview b{font-size:22px}
.preview.pos{background:var(--plus-bg);color:var(--plus)}
.preview.neg{background:var(--minus-bg);color:var(--minus)}
.preview.leave{background:var(--leave-bg);color:var(--leave)}
.actions{display:flex;gap:8px}
.btn{flex:1;border:0;border-radius:14px;padding:13px;font-family:inherit;font-size:15px;font-weight:600;cursor:pointer;background:#EEF2F6;color:var(--ink)}
.btn.main{background:var(--ink);color:#fff;flex:2}
.btn.del{color:var(--minus);flex:1}
.btn:active{transform:scale(.98)}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:12px;font-size:13px;z-index:20;opacity:0;pointer-events:none;transition:opacity .2s}
.toast.show{opacity:1}
@media (prefers-reduced-motion:reduce){.sheet{transition:none}}
</style>
</head>
<body>
<div class="app">
  <div class="bar">
    <h1>ساعت کاری</h1>
    <button class="iconbtn" id="btnSettings" aria-label="تنظیمات">⚙</button>
  </div>

  <div class="balance">
    <div class="lbl" id="balLbl">تراز این ماه</div>
    <div class="big num" id="balBig">+0:00</div>
    <div class="sub" id="balSub"></div>
    <div class="stats">
      <div class="stat"><b id="stWorked" class="num">0:00</b><span>کل ساعت کار</span></div>
      <div class="stat"><b id="stLeaveM">0</b><span>مرخصی این ماه</span></div>
      <div class="stat"><b id="stLeaveY">0</b><span>مرخصی امسال</span></div>
    </div>
  </div>

  <div class="nav">
    <button id="prev" aria-label="ماه قبل">›</button>
    <div class="title"><b id="mTitle"></b><small id="mSub"></small></div>
    <button id="next" aria-label="ماه بعد">‹</button>
  </div>

  <div class="cal">
    <div class="grid" id="dows"></div>
    <div class="grid" id="grid" style="margin-top:2px"></div>
    <div class="legend">
      <span><i style="background:var(--plus-bg)"></i>اضافه‌کار</span>
      <span><i style="background:var(--minus-bg)"></i>کسر</span>
      <span><i style="background:var(--leave-bg)"></i>مرخصی</span>
      <span><i style="background:var(--hol-bg)"></i>تعطیل</span>
    </div>
  </div>

  <div class="card" id="holCard" style="display:none">
    <h3>تعطیلات رسمی رومانی این ماه</h3>
    <div id="holList"></div>
  </div>
</div>

<div class="scrim" id="scrim"></div>

<!-- day editor -->
<div class="sheet" id="daySheet" role="dialog" aria-modal="true">
  <h2 id="dayTitle"></h2>
  <div class="hint" id="dayHint"></div>
  <div class="seg">
    <button id="tWork" class="on">کار</button>
    <button id="tLeave">مرخصی</button>
  </div>
  <div id="workFields">
    <div class="row2">
      <div><label class="f">ساعت ورود</label><input type="time" id="inStart"></div>
      <div><label class="f">ساعت خروج</label><input type="time" id="inEnd"></div>
    </div>
    <div class="toggle" id="lunchToggle">
      <div>ناهار بیرون / بدون حقوق<small id="lunchSmall">۱ ساعت از کار کم می‌شه</small></div>
      <div class="sw"></div>
    </div>
  </div>
  <div class="preview" id="preview"><span id="pvLbl"></span><b class="num" id="pvVal"></b></div>
  <div class="actions">
    <button class="btn del" id="btnDel">پاک کن</button>
    <button class="btn main" id="btnSave">ذخیره</button>
  </div>
</div>

<!-- settings -->
<div class="sheet" id="setSheet" role="dialog" aria-modal="true">
  <h2>تنظیمات</h2>
  <div class="hint">این مقادیر برای همه‌ی روزها اعمال می‌شن.</div>
  <div class="row2">
    <div><label class="f">ساعت کار روزانه</label><input type="number" id="sTarget" step="0.25" min="1" max="16"></div>
    <div><label class="f">مدت ناهار (دقیقه)</label><input type="number" id="sLunch" step="5" min="0" max="180"></div>
  </div>
  <div class="row2">
    <div><label class="f">ورود پیش‌فرض</label><input type="time" id="sStart"></div>
    <div><label class="f">خروج پیش‌فرض</label><input type="time" id="sEnd"></div>
  </div>
  <div class="row2">
    <div><label class="f">مرخصی سالانه (روز)</label><input type="number" id="sLeaveYear" min="0" max="60"></div>
    <div></div>
  </div>
  <div class="toggle" id="sLunchDef">
    <div>ناهار به‌صورت پیش‌فرض روشن باشه<small>موقع ثبت هر روز می‌تونی عوضش کنی</small></div>
    <div class="sw"></div>
  </div>
  <label class="f">پشتیبان‌گیری (کپی کن و جایی نگه دار؛ برای بازیابی همین‌جا بچسبون)</label>
  <textarea id="backup" spellcheck="false"></textarea>
  <div class="actions" style="margin-top:10px">
    <button class="btn" id="btnImport">بازیابی</button>
    <button class="btn" id="btnCopy">کپی</button>
    <button class="btn main" id="btnSetSave">ذخیره</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
/* ---------- constants ---------- */
const MONTHS_FA=["ژانویه","فوریه","مارس","آوریل","مه","ژوئن","ژوئیه","اوت","سپتامبر","اکتبر","نوامبر","دسامبر"];
const MONTHS_RO=["Ianuarie","Februarie","Martie","Aprilie","Mai","Iunie","Iulie","August","Septembrie","Octombrie","Noiembrie","Decembrie"];
const DOW_FA=["د","س","چ","پ","ج","ش","ی"]; // Mon..Sun (Romanian week)
const DOW_LONG=["یکشنبه","دوشنبه","سه‌شنبه","چهارشنبه","پنجشنبه","جمعه","شنبه"];
const STORE_KEY="workhours-v1";

/* ---------- state ---------- */
let state={
  settings:{targetMin:480,lunchMin:60,defStart:"08:00",defEnd:"17:00",defLunch:true,leaveYear:20},
  days:{}
};
const now=new Date();
let view={y:now.getFullYear(),m:now.getMonth()};
let edit=null; // {key,type,start,end,lunch}

/* ---------- storage ---------- */
async function loadState(){
  try{ if(window.storage){ const r=await window.storage.get(STORE_KEY); if(r&&r.value){ merge(JSON.parse(r.value)); return; } } }catch(e){}
  try{ const v=localStorage.getItem(STORE_KEY); if(v) merge(JSON.parse(v)); }catch(e){}
}
function merge(d){ if(!d) return; state.settings=Object.assign(state.settings,d.settings||{}); state.days=d.days||{}; }
async function saveState(){
  const s=JSON.stringify(state);
  try{ if(window.storage) await window.storage.set(STORE_KEY,s); }catch(e){}
  try{ localStorage.setItem(STORE_KEY,s); }catch(e){}
}

/* ---------- helpers ---------- */
const $=id=>document.getElementById(id);
const pad=n=>String(n).padStart(2,"0");
const keyOf=(y,m,d)=>`${y}-${pad(m+1)}-${pad(d)}`;
const toMin=t=>{ if(!t) return null; const [h,m]=t.split(":").map(Number); return h*60+m; };
function fmt(min,signed){
  const s=min<0?"-":(signed&&min>0?"+":(signed?"+":""));
  const a=Math.abs(Math.round(min));
  return s+Math.floor(a/60)+":"+pad(a%60);
}
function toast(msg){ const t=$("toast"); t.textContent=msg; t.classList.add("show"); setTimeout(()=>t.classList.remove("show"),1800); }

/* Romanian public holidays (Orthodox Easter computed) */
const holCache={};
function orthodoxEaster(y){
  const a=y%4,b=y%7,c=y%19,d=(19*c+15)%30,e=(2*a+4*b-d+34)%7;
  const mo=Math.floor((d+e+114)/31), da=((d+e+114)%31)+1;
  return new Date(Date.UTC(y,mo-1,da+13)); // Julian -> Gregorian
}
function holidays(y){
  if(holCache[y]) return holCache[y];
  const h={};
  const add=(m,d,n)=>{h[keyOf(y,m-1,d)]=n;};
  add(1,1,"Anul Nou");add(1,2,"Anul Nou");add(1,6,"Boboteaza");add(1,7,"Sf. Ioan Botezătorul");add(1,24,"Ziua Unirii");
  add(5,1,"Ziua Muncii");add(6,1,"Ziua Copilului");add(8,15,"Adormirea Maicii Domnului");
  add(11,30,"Sf. Andrei");add(12,1,"Ziua Națională");add(12,25,"Crăciun");add(12,26,"Crăciun");
  const e=orthodoxEaster(y);
  const off=(n,name)=>{const t=new Date(e.getTime()+n*864e5);h[keyOf(t.getUTCFullYear(),t.getUTCMonth(),t.getUTCDate())]=name;};
  off(-2,"Vinerea Mare");off(0,"Paștele ortodox");off(1,"Paștele ortodox (a doua zi)");
  off(49,"Rusalii");off(50,"Rusalii (a doua zi)");
  return holCache[y]=h;
}

/* day computation */
function dayInfo(y,m,d){
  const key=keyOf(y,m,d);
  const dow=new Date(y,m,d).getDay(); // 0 Sun
  const weekend=dow===0||dow===6;
  const hol=holidays(y)[key]||null;
  const off=weekend||!!hol;
  const target=off?0:state.settings.targetMin;
  const e=state.days[key]||null;
  let diff=null,worked=0,type=null;
  if(e){
    type=e.type;
    if(e.type==="leave"){ diff=0; }
    else{
      const s=toMin(e.start),en=toMin(e.end);
      if(s!=null&&en!=null){
        worked=Math.max(0,en-s)-(e.lunch?state.settings.lunchMin:0);
        if(worked<0) worked=0;
        diff=worked-target;
      }
    }
  }
  return {key,dow,weekend,hol,off,target,e,diff,worked,type};
}

/* ---------- render ---------- */
function render(){
  const {y,m}=view;
  $("mTitle").textContent=MONTHS_FA[m]+" "+y;
  $("mSub").textContent=MONTHS_RO[m];
  $("balLbl").textContent="تراز "+MONTHS_FA[m];

  // dow header
  $("dows").innerHTML=DOW_FA.map(x=>`<div class="dow">${x}</div>`).join("");

  const first=new Date(y,m,1).getDay();            // 0 Sun
  const lead=(first+6)%7;                           // Monday-first offset
  const dim=new Date(y,m+1,0).getDate();
  const today=keyOf(now.getFullYear(),now.getMonth(),now.getDate());

  let html="";
  for(let i=0;i<lead;i++) html+=`<div class="cell empty"></div>`;
  let total=0,workedSum=0,leaveM=0,logged=0,lunchDays=0;
  for(let d=1;d<=dim;d++){
    const i=dayInfo(y,m,d);
    let cls="cell",val="";
    if(i.hol) cls+=" hol"; else if(i.weekend) cls+=" off";
    if(i.e){
      if(i.type==="leave"){ cls+=" leave"; val="مرخصی"; if(i.target>0) leaveM++; }
      else if(i.diff!=null){
        cls+=i.diff>0?" pos":i.diff<0?" neg":" zero";
        val=fmt(i.diff,true);
        total+=i.diff; workedSum+=i.worked; logged++;
        if(i.e.lunch) lunchDays++;
      }
    }
    if(i.key===today) cls+=" today";
    html+=`<button class="${cls}" data-d="${d}"><span class="d num">${d}</span><span class="v">${val}</span></button>`;
  }
  $("grid").innerHTML=html;
  $("grid").querySelectorAll(".cell[data-d]").forEach(b=>b.onclick=()=>openDay(+b.dataset.d));

  // balance
  const big=$("balBig");
  big.textContent=fmt(total,true);
  big.className="big num "+(total>0?"pos":total<0?"neg":"");
  let sub;
  if(logged===0&&leaveM===0) sub="هنوز چیزی ثبت نکردی";
  else if(total>0) sub="اضافه‌کار داری";
  else if(total<0) sub="کسر کار داری";
  else sub="دقیقاً برابر";
  if(lunchDays) sub+=` · ناهار ${lunchDays} روز`;
  $("balSub").textContent=sub;
  $("stWorked").textContent=fmt(workedSum,false);
  $("stLeaveM").textContent=leaveM;

  // leave this year
  let leaveY=0;
  for(const k in state.days){
    if(k.startsWith(y+"-")&&state.days[k].type==="leave"){
      const [yy,mm,dd]=k.split("-").map(Number);
      if(dayInfo(yy,mm-1,dd).target>0) leaveY++;
    }
  }
  const ly=state.settings.leaveYear;
  $("stLeaveY").textContent=ly>0?`${leaveY} از ${ly}`:leaveY;

  // holiday list
  const hs=holidays(y),list=[];
  for(let d=1;d<=dim;d++){ const k=keyOf(y,m,d); if(hs[k]) list.push([d,hs[k]]); }
  $("holCard").style.display=list.length?"block":"none";
  $("holList").innerHTML=list.map(([d,n])=>`<div class="hrow"><span>${n}</span><span class="num">${d} ${MONTHS_RO[m].slice(0,3)}</span></div>`).join("");
}

/* ---------- day editor ---------- */
function openScrim(){ $("scrim").classList.add("open"); }
function closeAll(){
  $("scrim").classList.remove("open");
  $("daySheet").classList.remove("open");
  $("setSheet").classList.remove("open");
}
$("scrim").onclick=closeAll;

function openDay(d){
  const {y,m}=view;
  const i=dayInfo(y,m,d);
  const s=state.settings;
  edit={key:i.key,d,
    type:i.e?i.e.type:"work",
    start:i.e&&i.e.start?i.e.start:s.defStart,
    end:i.e&&i.e.end?i.e.end:s.defEnd,
    lunch:i.e&&i.e.type==="work"?!!i.e.lunch:s.defLunch,
    existing:!!i.e};
  $("dayTitle").innerHTML=`${DOW_LONG[i.dow]} <span class="num">${d}</span> ${MONTHS_FA[m]}`;
  $("dayHint").textContent=i.hol?`تعطیل رسمی: ${i.hol}. هر ساعتی کار کنی اضافه‌کار حساب می‌شه.`
    :i.weekend?"آخر هفته؛ هر ساعتی کار کنی اضافه‌کار حساب می‌شه."
    :`هدف امروز ${fmt(i.target,false)} ساعته.`;
  $("lunchSmall").textContent=`${s.lunchMin} دقیقه از کار کم می‌شه`;
  $("inStart").value=edit.start; $("inEnd").value=edit.end;
  $("btnDel").style.display=edit.existing?"":"none";
  syncEditor();
  openScrim(); $("daySheet").classList.add("open");
}

function syncEditor(){
  $("tWork").classList.toggle("on",edit.type==="work");
  $("tLeave").classList.toggle("on",edit.type==="leave");
  $("workFields").style.display=edit.type==="work"?"":"none";
  $("lunchToggle").classList.toggle("on",edit.lunch);
  const pv=$("preview");
  if(edit.type==="leave"){
    pv.className="preview leave"; $("pvLbl").textContent="مرخصی"; $("pvVal").textContent="۰ تغییر";
    $("pvVal").className="";
    return;
  }
  $("pvVal").className="num";
  const s=toMin($("inStart").value),e=toMin($("inEnd").value);
  if(s==null||e==null){ pv.className="preview"; $("pvLbl").textContent="ساعت‌ها رو وارد کن"; $("pvVal").textContent="—"; return; }
  const [yy,mm,dd]=edit.key.split("-").map(Number);
  const target=dayInfo(yy,mm-1,dd).target;
  let w=Math.max(0,e-s)-(edit.lunch?state.settings.lunchMin:0); if(w<0) w=0;
  const diff=w-target;
  pv.className="preview "+(diff>0?"pos":diff<0?"neg":"");
  $("pvLbl").textContent=`کار خالص ${fmt(w,false)}`;
  $("pvVal").textContent=fmt(diff,true);
}

$("tWork").onclick=()=>{edit.type="work";syncEditor();};
$("tLeave").onclick=()=>{edit.type="leave";syncEditor();};
$("lunchToggle").onclick=()=>{edit.lunch=!edit.lunch;syncEditor();};
$("inStart").oninput=$("inEnd").oninput=syncEditor;

$("btnSave").onclick=async()=>{
  if(edit.type==="leave") state.days[edit.key]={type:"leave"};
  else{
    const s=$("inStart").value,e=$("inEnd").value;
    if(!s||!e){ toast("ساعت ورود و خروج رو وارد کن"); return; }
    if(toMin(e)<=toMin(s)){ toast("خروج باید بعد از ورود باشه"); return; }
    state.days[edit.key]={type:"work",start:s,end:e,lunch:edit.lunch};
  }
  await saveState(); closeAll(); render(); toast("ذخیره شد");
};
$("btnDel").onclick=async()=>{
  delete state.days[edit.key]; await saveState(); closeAll(); render(); toast("پاک شد");
};

/* ---------- settings ---------- */
let tmpLunchDef=true;
$("btnSettings").onclick=()=>{
  const s=state.settings;
  $("sTarget").value=s.targetMin/60; $("sLunch").value=s.lunchMin;
  $("sStart").value=s.defStart; $("sEnd").value=s.defEnd; $("sLeaveYear").value=s.leaveYear;
  tmpLunchDef=s.defLunch; $("sLunchDef").classList.toggle("on",tmpLunchDef);
  $("backup").value=JSON.stringify(state);
  openScrim(); $("setSheet").classList.add("open");
};
$("sLunchDef").onclick=()=>{tmpLunchDef=!tmpLunchDef;$("sLunchDef").classList.toggle("on",tmpLunchDef);};
$("btnSetSave").onclick=async()=>{
  const t=parseFloat($("sTarget").value),l=parseInt($("sLunch").value,10);
  if(!(t>0)){ toast("ساعت کار روزانه معتبر نیست"); return; }
  state.settings={targetMin:Math.round(t*60),lunchMin:isNaN(l)?60:l,defStart:$("sStart").value||"08:00",defEnd:$("sEnd").value||"17:00",defLunch:tmpLunchDef,leaveYear:parseInt($("sLeaveYear").value,10)||0};
  await saveState(); closeAll(); render(); toast("تنظیمات ذخیره شد");
};
$("btnCopy").onclick=async()=>{
  const ta=$("backup"); ta.value=JSON.stringify(state);
  try{ await navigator.clipboard.writeText(ta.value); toast("کپی شد"); }
  catch(e){ ta.select(); try{document.execCommand("copy");toast("کپی شد");}catch(_){toast("دستی کپی کن");} }
};
$("btnImport").onclick=async()=>{
  try{
    const d=JSON.parse($("backup").value);
    if(!d||typeof d!=="object"||!d.days) throw 0;
    state={settings:Object.assign(state.settings,d.settings||{}),days:d.days};
    await saveState(); closeAll(); render(); toast("بازیابی شد");
  }catch(e){ toast("متن پشتیبان معتبر نیست"); }
};

/* ---------- nav ---------- */
$("prev").onclick=()=>{ view.m--; if(view.m<0){view.m=11;view.y--;} render(); };
$("next").onclick=()=>{ view.m++; if(view.m>11){view.m=0;view.y++;} render(); };

/* ---------- init ---------- */
loadState().then(render);
render();
</script>
</body>
</html>
